name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project (unzip if needed)
        id: find
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No project and no zip found. Files in the repo:"
              find . -not -path './.git/*' | head -50
              exit 1
            fi
            echo "Unzipping $ZIP"
            mkdir -p project
            unzip -o "$ZIP" -d project
            FILE=$(find project -name settings.gradle.kts | head -n 1)
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shortcuts-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
